spring.application.name=e-commerce
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:mysql://localhost:3306/ecommercespring_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
order.expiration.hours=24
inventory.low-stock.inventoryWarn=20 

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.redis.enabled=false

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Consumer
spring.kafka.consumer.group-id=ecommerce-payment-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.properties.spring.json.trusted.packages=com.aashir.payment.event,com.aashir.ecommerce.event


logging.level.org.springframework.kafka.config=DEBUG
logging.level.org.springframework.kafka.listener=DEBUG
logging.level.org.springframework.kafka=DEBUG

#Producer  timeouts
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

#OTP
password-reset.otp-length=6
password-reset.otp-expiry-minutes=10
password-reset.max-attempts=5
password-reset.resend-cooldown-seconds=60
password-reset.token-expiry-minutes=10

#service-to-service security
service.payment.url=http://localhost:8083
service.security.secret=${SERVICE_SECRET}